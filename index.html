<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Salone Clips | Watch and save Sierra Leone video</title>
  <meta name="description" content="Watch a Sierra Leone video clip and save a copy to your device in one tap.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Drawn from the national flag, pushed toward ink and paper */
      --green: #1A9B36;
      --green-deep: #0F5E22;
      --blue: #0A5FA8;
      --blue-ink: #0B2A44;
      --white: #FFFFFF;
      --paper: #F6F4EE;
      --line: #DCD8CC;
      --text: #14202E;
      --muted: #56606E;

      --serif: "Fraunces", Georgia, "Times New Roman", serif;
      --sans: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--paper);
      color: var(--text);
      font-family: var(--sans);
      font-size: 17px;
      line-height: 1.6;
      display: grid;
      grid-template-columns: 1fr;
    }

    /* Signature element: the flag as a structural rail.
       A band across the top on phones, a full-height column on wide screens. */
    .rail {
      display: grid;
      grid-template-rows: 1fr 1fr 1fr;
      height: 10px;
    }
    .rail span:nth-child(1) { background: var(--green); }
    .rail span:nth-child(2) { background: var(--white); box-shadow: inset 0 -1px 0 var(--line), inset 0 1px 0 var(--line); }
    .rail span:nth-child(3) { background: var(--blue); }

    .page {
      width: 100%;
      max-width: 1040px;
      margin: 0 auto;
      padding: 40px 24px 72px;
    }

    header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      padding-bottom: 28px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 48px;
    }

    .wordmark {
      font-family: var(--serif);
      font-weight: 700;
      font-size: 1.35rem;
      letter-spacing: -0.01em;
      color: var(--blue-ink);
      margin: 0;
      text-decoration: none;
    }

    .region {
      font-size: 0.95rem;
      color: var(--muted);
      margin: 0;
    }

    .intro {
      display: grid;
      gap: 40px;
    }

    h1 {
      font-family: var(--serif);
      font-weight: 700;
      font-size: clamp(2.4rem, 6.4vw, 4.2rem);
      line-height: 1.02;
      letter-spacing: -0.025em;
      margin: 0;
      color: var(--blue-ink);
      max-width: 14ch;
    }

    .intro p {
      margin: 0;
      font-size: 1.15rem;
      color: var(--muted);
      max-width: 38ch;
    }

    .player {
      margin-top: 48px;
      display: grid;
      gap: 24px;
    }

    .frame {
      background: var(--blue-ink);
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 1px 0 var(--line);
    }

    video {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      height: auto;
      background: var(--blue-ink);
    }

    .file {
      display: grid;
      gap: 20px;
      align-items: center;
      grid-template-columns: 1fr;
    }

    .file h2 {
      font-family: var(--serif);
      font-size: 1.5rem;
      font-weight: 600;
      margin: 0 0 4px;
      color: var(--blue-ink);
    }

    .file p {
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .file code {
      font-family: var(--sans);
      font-weight: 600;
      color: var(--text);
    }

    .download {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      background: var(--green);
      color: var(--white);
      text-decoration: none;
      font-family: var(--sans);
      font-weight: 700;
      font-size: 1.05rem;
      padding: 16px 28px;
      border-radius: 6px;
      min-height: 52px;
      transition: background-color 160ms ease;
    }

    .download:hover { background: var(--green-deep); }

    .download svg {
      width: 20px;
      height: 20px;
      flex: none;
    }

    :focus-visible {
      outline: 3px solid var(--blue);
      outline-offset: 3px;
    }

    footer {
      margin-top: 72px;
      padding-top: 24px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.92rem;
    }

    /* Wide screens: the flag becomes a rail, and the file row sits beside the player */
    @media (min-width: 860px) {
      body {
        grid-template-columns: 10px 1fr;
      }

      .rail {
        position: sticky;
        top: 0;
        height: 100vh;
        width: 10px;
        grid-template-rows: 1fr 1fr 1fr;
      }

      .page {
        padding: 64px 64px 80px;
      }

      .player {
        grid-template-columns: 1.6fr 1fr;
        align-items: start;
        gap: 48px;
      }

      .file {
        padding-top: 8px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; animation: none !important; }
    }
  </style>
</head>
<body>
  <div class="rail" aria-hidden="true">
    <span></span><span></span><span></span>
  </div>

  <div class="page">
    <header>
      <p class="wordmark">Salone Clips</p>
      <p class="region">Sierra Leone</p>
    </header>

    <section class="intro">
      <h1>Sierra Leone, kept on your device.</h1>
      <p>Watch the clip here, then save your own copy in one tap.</p>
    </section>

    <section class="player" aria-label="Video">
      <div class="frame">
        <video controls preload="metadata" src="video.mp4" aria-describedby="file-note">
          Your browser cannot play this video. You can still download it below.
        </video>
      </div>

      <div class="file">
        <div>
          <h2>The clip</h2>
          <p id="file-note"><code>video.mp4</code>, MP4 format. Plays in any modern browser.</p>
        </div>

        <a class="download" href="video.mp4" download="video.mp4">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 3v12"/>
            <path d="m7 10 5 5 5-5"/>
            <path d="M5 21h14"/>
          </svg>
          Download video
        </a>
      </div>
    </section>

    <footer>
      Salone Clips. Keep <code>video.mp4</code> in the same folder as this page.
    </footer>
  </div>
</body>
</html>
